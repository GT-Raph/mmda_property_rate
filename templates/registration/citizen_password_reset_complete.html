{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updated</title>
    <link rel="stylesheet" href="{% static 'css/owner_auth.css' %}">
</head>
<body>
<main class="auth-page"><section class="auth-card">
    <img class="auth-logo" src="{% static 'images/mmda_logo_1.png' %}" alt="PRMS Logo">
    <h1 class="auth-title">Password updated</h1>
    <p class="auth-copy">Your password has been reset successfully. You can now sign in using your phone number and new password.</p>
    <a class="auth-button" href="{% url 'owner-login' %}" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">Continue to owner login</a>
</section></main>
</body>
</html>
