{% load static %}

<nav class="bottom-nav" aria-label="Owner portal navigation">

    <a
        href="{% url 'citizens:dashboard' %}"
        class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
    >
        <span class="nav-ico nav-img">
            <img
                src="{% static 'images/icons/dashboard.png' %}"
                alt=""
                class="nav-icon-img"
                aria-hidden="true"
            >
        </span>
        Dashboard
    </a>


    <a
        href="{% url 'citizens:properties' %}"
        class="{% if request.resolver_match.url_name == 'properties' or request.resolver_match.url_name == 'property-bills' or request.resolver_match.url_name == 'property-certificate' %}active{% endif %}"
    >
        <span class="nav-ico nav-img">
            <img
                src="{% static 'images/icons/property.png' %}"
                alt=""
                class="nav-icon-img"
                aria-hidden="true"
            >
        </span>
        Properties
    </a>


    <a
        href="{% url 'citizens:bills' %}"
        class="{% if request.resolver_match.url_name == 'bills' or request.resolver_match.url_name == 'bill-detail' %}active{% endif %}"
    >
        <span class="nav-ico nav-img">
            <img
                src="{% static 'images/icons/bill.png' %}"
                alt=""
                class="nav-icon-img"
                aria-hidden="true"
            >
        </span>
        Bills
    </a>


    <a
        href="{% url 'citizens:certificates' %}"
        class="{% if request.resolver_match.url_name == 'certificates' %}active{% endif %}"
    >
        <span class="nav-ico nav-img">
            <img
                src="{% static 'images/icons/qr-code.png' %}"
                alt=""
                class="nav-icon-img"
                aria-hidden="true"
            >
        </span>
        Certificates
    </a>


    <a
        href="{% url 'notifications' %}"
        class="
            notification-nav-wrap
            {% if request.resolver_match.url_name == 'notifications' %}
                active
            {% endif %}
        "
    >
        <span class="nav-ico nav-img">
            <img
                src="{% static 'images/icons/notification.png' %}"
                alt=""
                class="nav-icon-img"
                aria-hidden="true"
            >
        </span>

        Notifications

        {% if unread_notification_count %}
            <span class="notification-nav-badge">
                {{ unread_notification_count }}
                <span class="visually-hidden"> unread</span>
            </span>
        {% endif %}
    </a>


    <a
        href="{% url 'citizens:profile' %}"
        class="{% if request.resolver_match.url_name == 'profile' %}active{% endif %}"
    >
        <span class="nav-ico nav-img">
            <img
                src="{% static 'images/icons/settings.png' %}"
                alt=""
                class="nav-icon-img"
                aria-hidden="true"
            >
        </span>
        Profile
    </a>

</nav>
