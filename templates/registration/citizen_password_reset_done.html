{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email</title>
    <link rel="stylesheet" href="{% static 'css/owner_auth.css' %}">
</head>
<body>
<main class="auth-page"><section class="auth-card">
    <img class="auth-logo" src="{% static 'images/mmda_logo_1.png' %}" alt="PRMS Logo">
    <h1 class="auth-title">Check your email</h1>
    <p class="auth-copy">If an active owner account matches that email, a password-reset link has been sent. Check your inbox and spam folder.</p>
    <div class="auth-actions"><a class="auth-link" href="{% url 'owner-login' %}">Return to owner login</a></div>
</section></main>
</body>
</html>
